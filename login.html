<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Estoque</title>
    <link rel="stylesheet" href="./css/jogo.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Controle de Estoque</h1>
            <p>Equipamentos - Notebooks e Celulares</p>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('login')">Entrar</button>
                <button class="tab-btn" onclick="showTab('register')">Cadastrar</button>
            </div>

            <!-- Formulário de Login -->
            <div id="login-form" class="form-container active">
                <form onsubmit="handleLogin(event)">
                    <input type="email" id="login-email" placeholder="E-mail" required>
                    <input type="password" id="login-password" placeholder="Senha" required>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
            </div>

            <!-- Formulário de Cadastro -->
            <div id="register-form" class="form-container">
                <form onsubmit="handleRegister(event)">
                    <input type="email" id="register-email" placeholder="E-mail" required>
                    <input type="password" id="register-password" placeholder="Senha" required>
                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js'

        window.handleLogin = async function(event) {
            event.preventDefault()
            const email = document.getElementById('login-email').value
            const password = document.getElementById('login-password').value
            const messageDiv = document.getElementById('message')

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            })

            if (error) {
                messageDiv.textContent = 'Erro: ' + error.message
                messageDiv.className = 'message error'
            } else {
                messageDiv.textContent = 'Login realizado! Redirecionando...'
                messageDiv.className = 'message success'
                setTimeout(() => {
                    window.location.href = 'dashboard.html'
                }, 1000)
            }
        }

        window.handleRegister = async function(event) {
            event.preventDefault()
            const email = document.getElementById('register-email').value
            const password = document.getElementById('register-password').value
            const messageDiv = document.getElementById('message')

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password
            })

            if (error) {
                messageDiv.textContent = 'Erro: ' + error.message
                messageDiv.className = 'message error'
            } else {
                messageDiv.textContent = 'Cadastro realizado! Faça login para continuar.'
                messageDiv.className = 'message success'
                document.getElementById('register-form').reset()
                showTab('login')
            }
        }

        window.showTab = function(tab) {
            const loginForm = document.getElementById('login-form')
            const registerForm = document.getElementById('register-form')
            const buttons = document.querySelectorAll('.tab-btn')
            
            if (tab === 'login') {
                loginForm.classList.add('active')
                registerForm.classList.remove('active')
                buttons[0].classList.add('active')
                buttons[1].classList.remove('active')
            } else {
                loginForm.classList.remove('active')
                registerForm.classList.add('active')
                buttons[0].classList.remove('active')
                buttons[1].classList.add('active')
            }
            document.getElementById('message').textContent = ''
        }
    </script>
</body>
</html>
