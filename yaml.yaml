version: "1"

services:
  # FRONTEND
  - type: web
    name: stock-frontend
    runtime: static
    repo: https://github.com/SouReiDavi/Stock-control
    staticPublishPath: frontend

  # BACKEND
  - type: web
    name: stock-backend
    runtime: node
    repo: https://github.com/SouReiDavi/Stock-control
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js